name: publish

# Manual only. The publish job additionally waits behind a protected environment,
# so a dispatch alone cannot put anything on the registry.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: The reviewed commit on main this release must be built from
        required: true
        type: string
      audit_only:
        description: Produce the audited tarball and stop, leaving nothing to approve or stage
        required: false
        default: false
        type: boolean

# Workflow level is read-only on purpose: the ungated audit job must never hold
# publish-capable authority.
permissions:
  contents: read

jobs:
  # Builds and inspects the exact bytes that would be published. No credentials here.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read as an environment variable rather than interpolated into the shell.
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Check this run is the reviewed commit on main
        run: |
          [ "$GITHUB_REF" = "refs/heads/main" ] || exit 1
          [ "$GITHUB_SHA" = "$EXPECTED_SHA" ] || exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      # The package manager is the one bundled with that Node, so no job ever fetches
      # its own tooling from the network.
      - name: Check the package manager is the one bundled with this Node
        run: '[ "$(npm --version)" = "11.17.0" ]'
      - run: npm ci
      - run: npm run build

      - name: Pack the package
        id: pack
        run: echo "tgz=$(npm pack --json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0].filename')" >> "$GITHUB_OUTPUT"
      # Two digests: SHA-256 is what the staged bytes are checked against by hand,
      # SHA-512 is what a provenance attestation names its subject with.
      - name: Record the tarball hashes
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          set -euo pipefail
          sha256sum "$TGZ" | tee tarball.sha256
          sha512sum "$TGZ" | tee tarball.sha512
      - name: Audit what the tarball contains
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: npm run audit:tarball -- "$TGZ"

      # The fixtures install the packed tarball on the lowest supported Node.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
      - name: Check the package manager is the one bundled with this Node
        run: '[ "$(npm --version)" = "10.8.2" ]'
      - name: Install the tarball into ESM, CommonJS and TypeScript projects
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: npm run test:consumers -- "$TGZ"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: |
            ${{ steps.pack.outputs.tgz }}
            tarball.sha256
            tarball.sha512
          if-no-files-found: error

  # Stages the artifact the audit job produced. The environment approval happens
  # here: after the audit, immediately before the registry is changed. Staging never
  # makes a version installable — promoting it is a separate, 2FA-protected act.
  publish:
    needs: audit
    # An audit-only run never reaches this job, so no approval is left pending on it.
    if: ${{ !inputs.audit_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      # How this job proves to npm which repository, workflow and run it is — both the
      # OIDC credential it authenticates with and what the provenance is minted from.
      # This is the only job that holds the permission.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          registry-url: https://registry.npmjs.org
      - name: Check the package manager is the one bundled with this Node
        run: '[ "$(npm --version)" = "11.17.0" ]'
      # The hash is rechecked in the same step that sends the bytes, so there is no
      # window between verifying them and staging them. The file staged is the one the
      # hash record names, not whatever tarball happens to be here; a record that is
      # missing, ambiguous, or names an absent file fails the step.
      - name: Verify the audited bytes and stage them
        run: |
          set -euo pipefail
          [ "$(wc -l < tarball.sha256)" = "1" ]
          tgz="$(awk '{ print $2 }' tarball.sha256)"
          [ -n "$tgz" ]
          [ -f "$tgz" ]
          sha256sum -c tarball.sha256
          npm stage publish "./$tgz" --provenance --access public --ignore-scripts
