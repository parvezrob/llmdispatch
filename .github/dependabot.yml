version: 2

# One grouped pull request per ecosystem per week. Grouping changes how updates are
# proposed, not how versions are pinned: actions stay pinned to a commit SHA.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The package has no runtime dependencies, so only the toolchain is updated here.
    allow:
      - dependency-type: development
    # Some majors are held back deliberately. TypeScript stays on 5.9 until typescript-eslint
    # supports a newer one, since the lint rules are what the strictness rests on; @types/node
    # tracks the Node 20 floor in `engines`, so a major here would describe a Node the package
    # does not claim to support. Vitest and its coverage provider stay on 4 while that floor
    # holds: Vitest 5 requires Node 22.12 or later, and the test suite runs on the floor in
    # CI. All of them move by hand, with the reason in the pull request.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/coverage-v8'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        patterns:
          - '*'

  # The examples pin every dependency exactly and commit a lockfile, so they go stale like
  # any other project and are updated the same way. Their `llmdispatch` dependency is the
  # locally packed tarball rather than a registry one, and is not something to update here.
  # `@types/node` tracks the package's Node 20 floor in the Next.js example for the same
  # reason it does at the root.
  - package-ecosystem: npm
    directory: /examples/express
    schedule:
      interval: weekly
    groups:
      example-express:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /examples/next
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      example-next:
        patterns:
          - '*'
